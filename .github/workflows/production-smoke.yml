name: Smoke-test deployed Classic H5 on GitHub Pages

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Exercise the *real GitHub Pages URL* as desktop and Pixel 7
        run: node tests/production-smoke.mjs
        env:
          CLASSIC_PUBLIC_URL: https://pkinfran.github.io/tap_test/
      - name: Preserve real production screenshots even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-pages-desktop-mobile-smoke
          path: test-artifacts
          retention-days: 14
          if-no-files-found: warn
